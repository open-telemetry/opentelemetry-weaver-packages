file_format: definition/2

metrics:
  - name: base.metric
    stability: development
    brief: A metric.
    instrument: counter
    unit: '{operation}'

spans:
  - type: base.span
    kind: client
    name:
      note: Use the operation name.
    stability: development
    brief: A span.

metric_refinements:
  - id: migrated.direct
    ref: base.metric
    annotations:
      compatibility:
        policy_exceptions: [metric_missing]
  - id: metric.migrated.prefixed
    ref: base.metric
    annotations:
      compatibility:
        policy_exceptions: [metric_missing]
  - id: metric.missing.unannotated
    ref: base.metric
  - id: metric.missing.wrong_key
    ref: base.metric
    annotations:
      compatibility:
        policy_exceptions: [unrelated]
  - id: metric.missing.wrong_namespace
    ref: base.metric
    annotations:
      stability:
        policy_exceptions: [metric_missing]
  - id: metric.unrelated
    ref: base.metric
    annotations:
      compatibility:
        policy_exceptions: [metric_missing]
  - id: metric.missing.baseline_only
    ref: base.metric

span_refinements:
  - id: metric.missing.wrong_signal
    ref: base.span
    annotations:
      compatibility:
        policy_exceptions: [metric_missing]
