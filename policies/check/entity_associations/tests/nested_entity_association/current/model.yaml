file_format: definition/2
attributes:
  - key: my.id
    brief: An id attribute.
    type: string
    stability: stable
entities:
  - type: known.entity
    brief: A known entity.
    stability: stable
    identity:
      - ref: my.id
  - type: other.entity
    brief: Another known entity.
    stability: stable
    identity:
      - ref: my.id
metrics:
  - name: my.metric
    brief: A metric with a nested association over known entities.
    stability: stable
    instrument: counter
    unit: "1"
    entity_associations:
      - all_of:
          - known.entity
          - one_of:
              - other.entity
              - known.entity
