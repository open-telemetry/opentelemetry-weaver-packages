file_format: definition/2
attributes:
  - key: test.payload
    type: any
    brief: Payload.
    stability: development
    annotations:
      value:
        unbounded_size: true
  - key: test.payload_ref
    type: string
    brief: Reference to the payload.
    stability: development
  - key: test.content_ref
    type: string
    brief: Reference without counterpart.
    stability: development
  - key: test.body
    type: any
    brief: Body.
    stability: development
    annotations:
      value:
        unbounded_size: true
  - key: test.body_ref
    type: int
    brief: Reference with invalid type.
    stability: development
  - key: test.bounded
    type: string
    brief: Bounded attribute without unbounded_size annotation.
    stability: development
  - key: test.bounded_ref
    type: string
    brief: Reference whose counterpart is not unbounded.
    stability: development
  - key: test.entity.id
    type: string
    brief: Entity identifier.
    stability: development
  - key: test.summary
    type: string
    brief: Unbounded string attribute for entity testing.
    stability: development
    annotations:
      value:
        unbounded_size: true
  - key: test.summary_ref
    type: string
    brief: Reference to the summary.
    stability: development
  - key: test.legacy
    type: string
    brief: Unbounded attribute with a deprecated reference counterpart.
    stability: development
    annotations:
      value:
        unbounded_size: true
  - key: test.legacy_ref
    type: string
    brief: Deprecated reference attribute.
    stability: development
    deprecated:
      reason: obsoleted
      note: Replaced by test.summary_ref.
spans:
  - type: test.valid_span
    brief: Span with both base and reference attributes.
    stability: development
    kind: client
    name:
      note: test
    attributes:
      - ref: test.payload
        requirement_level: opt_in
      - ref: test.payload_ref
        requirement_level: opt_in
  - type: test.missing_base_span
    brief: Span with reference attribute but missing base attribute.
    stability: development
    kind: client
    name:
      note: test
    attributes:
      - ref: test.payload_ref
        requirement_level: opt_in
  - type: test.deprecated_ref_span
    brief: Non-deprecated span with a deprecated reference attribute and missing base attribute.
    stability: development
    kind: client
    name:
      note: test
    attributes:
      - ref: test.legacy_ref
        requirement_level: opt_in
  - type: test.orphan_ref_span
    brief: Span with a reference attribute whose counterpart does not exist.
    stability: development
    kind: client
    name:
      note: test
    attributes:
      - ref: test.content_ref
        requirement_level: opt_in
  - type: test.base_span
    brief: Base span for refinement testing.
    stability: development
    kind: client
    name:
      note: test
  - type: test.deprecated_span
    brief: Deprecated span with reference attribute only.
    stability: development
    deprecated:
      reason: obsoleted
      note: Replaced by test.valid_span.
    kind: client
    name:
      note: test
    attributes:
      - ref: test.payload_ref
        requirement_level: opt_in
span_refinements:
  - id: test.missing_base_span_refinement
    ref: test.base_span
    brief: Span refinement with reference attribute but missing base attribute.
    stability: development
    attributes:
      - ref: test.payload_ref
        requirement_level: opt_in
events:
  - name: test.missing_base_event
    brief: Event with reference attribute but missing base attribute.
    stability: development
    attributes:
      - ref: test.payload_ref
        requirement_level: opt_in
  - name: test.base_event
    brief: Base event for refinement testing.
    stability: development
event_refinements:
  - id: test.missing_base_event_refinement
    ref: test.base_event
    brief: Event refinement with reference attribute but missing base attribute.
    stability: development
    attributes:
      - ref: test.payload_ref
        requirement_level: opt_in
entities:
  - type: test.valid_entity
    brief: Entity with both base and reference attributes.
    stability: development
    identity:
      - ref: test.entity.id
    description:
      - ref: test.summary
        requirement_level: opt_in
      - ref: test.summary_ref
        requirement_level: opt_in
  - type: test.missing_base_entity
    brief: Entity with reference attribute but missing base attribute.
    stability: development
    identity:
      - ref: test.entity.id
    description:
      - ref: test.summary_ref
        requirement_level: opt_in
  - type: test.base_entity
    brief: Base entity for refinement testing.
    stability: development
    identity:
      - ref: test.entity.id
  - type: test.deprecated_entity
    brief: Deprecated entity with reference attribute only.
    stability: development
    deprecated:
      reason: obsoleted
      note: Replaced by test.valid_entity.
    identity:
      - ref: test.entity.id
    description:
      - ref: test.summary_ref
        requirement_level: opt_in
entity_refinements:
  - id: test.missing_base_entity_refinement
    ref: test.base_entity
    brief: Entity refinement with reference attribute but missing base attribute.
    stability: development
    description:
      - ref: test.summary_ref
        requirement_level: opt_in
